services:
  notification_db:
    image: postgres:16.4
    container_name: notification_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-notification_db}
      PGDATA: /data/postgres
      # Set TZ so that Go time.Now() and Postgres NOW() work with Moscow wall time.
      # Combined with DB timezone param and internal/helper clock helpers.
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - ./../postgres_data_notification:/data/postgres
    ports:
      # Пробрасываем порт 5434 на хост, так как 5432 может быть занят бэкендом (Symfony)
      - "${DB_PORT:-5434}:5432"
    networks:
      - notification-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  notification_service:
    build:
      context: .
      dockerfile: ./docker_env/go/Dockerfile
    container_name: notification_service
    restart: unless-stopped
    depends_on:
      notification_db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      # Прокидываем текущую папку с бинарником main
      - ./:/app
      # Прокидываем публичный ключ JWT из папки Symfony
      - ./../symfony_documents_flow/config/jwt/public.pem:/config/jwt/public.pem:ro
    environment:
      # Переопределяем путь к ключу внутри контейнера
      - JWT_PUBLIC_KEY_PATH=/config/jwt/public.pem
      # Переопределяем хост БД для докера
      - DB_HOST=notification_db
      # Внутри Docker-сети Postgres всегда слушает на 5432 (5434 - это только проброс на хост)
      - DB_PORT=5432
      # RabbitMQ живёт в общей project-net сети рядом с Symfony
      - RABBITMQ_TRANSPORT_DSN=amqp://guest:guest@rabbitmq:5672/
      # TZ=Europe/Moscow so that Go's time.Now() returns Moscow wall time.
      # Combined with DB "timezone=..." param + internal/helper, we persist actual civil time.
      - TZ=${TZ:-Europe/Moscow}
    # Не надо пробрасывать наружу. Порт пробросит сам nginx
    # ports:
    #   - "${SERVER_PORT:-8086}:8086"
    networks:
      - notification-net
      - project-net

networks:
  notification-net:
    name: notification-net
    driver: bridge

  project-net:
    external: true
